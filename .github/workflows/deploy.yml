# Publica el juego en GitHub Pages cada vez que se sube código a main o master: revisa que los niveles de Súper
# Bolitas se puedan pasar, arma el juego y lo publica (unos minutos). Las pruebas completas (bots que juegan cada
# juego con controles simulados) se corren en la compu antes de subir (npm test, unos 20 minutos), porque aquí, sin
# tarjeta de video, tardaban unos 45; si se quieren correr aquí también, está "Pruebas completas" (pruebas.yml).
# Requiere: Settings → Pages → Source: "GitHub Actions" en el repo de GitHub.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/plat-check.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
